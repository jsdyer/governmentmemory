name: Build and publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '16 14 * * 1'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Build the static application
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if test -f requirements.txt; then
            python3 -m venv "$RUNNER_TEMP/app-venv"
            . "$RUNNER_TEMP/app-venv/bin/activate"
            python3 -m pip install -r requirements.txt
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && -n "$BASE_SHA" ]] &&
             git cat-file -e "$BASE_SHA^{commit}" &&
             ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- data/official-export.json.gz; then
            python3 scripts/build.py --official-export data/official-export.json.gz
          else
            python3 scripts/build.py
          fi
          test -s dist/index.html
      - name: Run application tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          shopt -s nullglob
          tests=(tests/*.test.mjs tests/*.test.cjs)
          if (( ${#tests[@]} )); then
            node --test "${tests[@]}"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
